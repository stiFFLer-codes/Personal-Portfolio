<!doctype html>
<!--
  Source for public/og.png, the 1200x630 Open Graph card. Built from the
  site's own tokens and self-hosted fonts; no external request. Regenerate
  after `npm install` with:

    node scripts/og-image.mjs

  Fixed pixel sizes are deliberate here: this is a raster at one known size,
  not a page that reflows.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/soft.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="../src/styles/global.css" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 76px 52px;
      }
      .name {
        font-family: var(--font-display);
        font-variation-settings: 'SOFT' 60;
        font-weight: 600;
        font-size: 30px;
        margin: 0;
      }
      .card .thesis {
        font-size: 88px;
        max-width: none;
        margin: 0;
        animation: none;
      }
      .card .thesis mark { animation: none; background-size: 100% 100%; }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 22px;
        border-top: 3px solid var(--ink);
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--ink-soft);
      }
      .foot b { color: var(--ink); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="name">Maitreya Sapariya</p>
      <p class="thesis">I build software systems that report what they <mark>couldn’t resolve.</mark></p>
      <div class="foot">
        <span><b>Software Engineer</b>, Crest Infosystems</span>
        <span>maitreyasapariya.me</span>
      </div>
    </div>
  </body>
</html>
