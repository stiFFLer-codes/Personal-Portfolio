<!doctype html>
<!--
  Source for public/og.png, the 1200×630 Open Graph card. Built from the
  site's own tokens and self-hosted fonts; no external request. Regenerate
  after `npm install` with headless Chromium, then crop the top 1200×630
  (new headless mode reserves part of the window for browser chrome, so a
  630px-tall window clips the bottom of the card):

    chromium --headless --hide-scrollbars --force-device-scale-factor=1 \
      --allow-file-access-from-files --virtual-time-budget=3000 \
      --window-size=1200,900 --screenshot=og-tall.png scripts/og-image.html
    # then crop og-tall.png to (0, 0, 1200, 630) and save as public/og.png

  Fixed pixel sizes are deliberate here: this is a raster at one known size,
  not a page that reflows.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/newsreader/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/newsreader/wght-italic.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="../src/styles/global.css" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      .card {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 84px 88px 56px;
        border-left: 6px solid var(--signal-green);
      }
      .name {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.018em;
        color: var(--ink);
        margin: 0 0 32px;
      }
      .thesis {
        font-family: var(--font-body);
        font-style: italic;
        font-weight: 400;
        font-size: 48px;
        line-height: 1.18;
        color: var(--ink-soft);
        margin: 0;
        max-width: 900px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        padding-top: 24px;
        border-top: 1px solid var(--hairline-strong);
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--ink-faint);
      }
      .foot b { color: var(--ink); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <p class="name">Maitreya Sapariya</p>
        <p class="thesis">I build software systems that report what they couldn’t resolve.</p>
      </div>
      <div class="foot">
        <span><b>Software Engineer</b>, Crest Infosystems</span>
        <span>maitreyasapariya.me</span>
      </div>
    </div>
  </body>
</html>
